{% extends 'base.html' %}
{% block title %}Editar Usuario{% endblock %}

{% block content %}
<h2>Editar Usuario</h2>
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input type="text" name="name" value="{{ user.name }}" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Correo Electrónico</label>
    <input type="email" name="email" value="{{ user.email }}" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Contraseña (dejar vacío para no cambiarla)</label>
    <input type="password" name="password" class="form-control">
  </div>
  <div class="mb-3">
    <label class="form-label">Rol</label>
    <select name="role" class="form-select">
      <option value="super_admin" {% if user is defined and user.role == 'super_admin' %}selected{% endif %}>Superadministrador</option>
      <option value="user" {% if user.role == 'user' %}selected{% endif %}>Solicitante</option>
      <option value="technician" {% if user.role == 'technician' %}selected{% endif %}>Técnico de TI</option>
      <option value="manager" {% if user.role == 'manager' %}selected{% endif %}>Responsable de área</option>
      <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrador de TI</option>
    </select>
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" name="is_active" class="form-check-input" id="isActive"
           {% if user.is_active %}checked{% endif %}>
    <label class="form-check-label" for="isActive">Usuario activo</label>
  </div>
  {% include 'users/area_field.html' %}
  <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar Cambios</button>
  <a href="{{ url_for('list_users') }}" class="btn btn-secondary"><i class="bi bi-x-lg"></i> Cancelar</a>
</form>
{% endblock %}
